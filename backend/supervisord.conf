[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─── FastAPI web server ────────────────────────────────────────────────────────
; --workers 4 runs 4 uvicorn processes behind a single port — scale this to
; (2 × CPU cores) for your VPS. Each worker is independent; Celery tasks are
; NOT in any of them so adding workers never causes duplicate task execution.

[program:web]
command=/path/to/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/path/to/backend
autostart=true
autorestart=true
startretries=5
stderr_logfile=/var/log/supervisor/web.err.log
stdout_logfile=/var/log/supervisor/web.out.log
environment=PATH="/path/to/venv/bin:%(ENV_PATH)s"

; ─── Celery worker ────────────────────────────────────────────────────────────
; gevent pool with concurrency=100 handles 100 simultaneous Supabase calls.
; For 500 classes all firing at the same time (~1500 tasks in 2 minutes), this
; drains the queue in ~15 seconds. Scale concurrency higher if needed — gevent
; workers are cheap because they don't use threads, just coroutines.

[program:worker]
command=/path/to/venv/bin/celery -A celery_app worker --pool=gevent --concurrency=100 --loglevel=info
directory=/path/to/backend
autostart=true
autorestart=true
startretries=5
stderr_logfile=/var/log/supervisor/worker.err.log
stdout_logfile=/var/log/supervisor/worker.out.log
environment=PATH="/path/to/venv/bin:%(ENV_PATH)s"

; ─── Celery Beat ──────────────────────────────────────────────────────────────
; Beat fires the check_missed_classes task every 15 minutes.
; IMPORTANT: run exactly ONE Beat process — multiple Beat processes will each
; fire the periodic task, creating duplicate missed-class processing.
; supervisord ensures it stays running; if it crashes, it restarts within seconds.

[program:beat]
command=/path/to/venv/bin/celery -A celery_app beat --loglevel=info
directory=/path/to/backend
autostart=true
autorestart=true
startretries=5
stderr_logfile=/var/log/supervisor/beat.err.log
stdout_logfile=/var/log/supervisor/beat.out.log
environment=PATH="/path/to/venv/bin:%(ENV_PATH)s"
